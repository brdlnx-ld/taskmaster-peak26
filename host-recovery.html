<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#66131d">
<title>Host Recovery — Taskmaster PEAK 26</title>
<style>
body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box;background:#66131d;color:#f7e4bf;font:16px system-ui,sans-serif}
main{max-width:550px;background:#2d0d15;border:1px solid #c89d57;border-radius:14px;padding:26px}
h1{margin:0 0 10px;font-size:26px}p{line-height:1.5}
a{display:inline-block;background:#f4dfb9;color:#521722;padding:12px 16px;border-radius:8px;font-weight:700;text-decoration:none}
small{display:block;margin-top:15px;color:#d9b990}
</style>
</head>
<body>
<main>
<h1>Taskmaster — Host Recovery</h1>
<p id="progress" role="status">Refreshing your Taskmaster app and opening Host Dashboard…</p>
<p><a href="./host.html?recovered=v15" id="manual-link">Open Host Dashboard</a></p>
<small>This refreshes only the Taskmaster site's offline files. It does not sign you out or change competition data.</small>
</main>
<script>
(async function () {
 const status=document.getElementById('progress');
 const dest=new URL('./host.html?recovered=v15',location.href);
 try {
   if ('serviceWorker' in navigator) {
     const registrations=await navigator.serviceWorker.getRegistrations();
     const base=new URL('./',location.href).href;
     await Promise.all(registrations.filter(r=>r.scope.startsWith(base)).map(r=>r.unregister()));
   }
   if ('caches' in window) {
     const names=await caches.keys();
     await Promise.all(names.filter(n=>n.startsWith('peak26-shell-')).map(n=>caches.delete(n)));
   }
   status.textContent='Cache cleared. Opening the secure Host Dashboard…';
 } catch(error) {
   status.textContent='Automatic refresh was limited by your browser. Opening the Host Dashboard anyway…';
 }
 location.replace(dest.href);
})()
</script>
</body>
</html>
