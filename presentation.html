<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskmaster PEAK 26 — Zoom Audience View</title><link rel="stylesheet" href="styles.css"><style>body{display:grid;place-items:center;min-height:100vh}#stage{width:min(1100px,95vw);min-height:75vh;background:#1e070e;border:16px ridge #bd9255;padding:6vw;display:flex;justify-content:center;align-items:center;text-align:center;flex-direction:column}h1{font:clamp(34px,5vw,74px) 'Special Elite',Georgia,serif;color:#f9e9cb}p{color:#e3b96d;font:clamp(18px,2.5vw,30px) Georgia,serif}.seal{width:90px;height:90px;font-size:36px}</style></head><body><main id="stage"><span class="eyebrow">SOUTHERN CLUSTER CHAMPIONSHIP</span><h1 id="title">TASKMASTER PEAK 26</h1><div class="seal">26</div><img id="photo" alt="Revealed competition entry" style="max-height:40vh;max-width:80vw;object-fit:contain;display:none;border:7px ridge #bd9255;margin-top:15px"><p id="subtitle">Awaiting the host's next reveal…</p></main><script>const c=new BroadcastChannel('peak26-finale');c.onmessage=e=>{if(!e.data||typeof e.data.heading!=='string')return;document.getElementById('title').textContent=e.data.heading;document.getElementById('subtitle').textContent=e.data.sub||'';const img=document.getElementById('photo');if(e.data.image&&/^https:\/\//.test(e.data.image)){img.src=e.data.image;img.style.display='block'}else{img.removeAttribute('src');img.style.display='none'}}</script></body></html>
